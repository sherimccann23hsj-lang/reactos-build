jobs:
  lkj:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Compute step-5 hash
          command: |
            mkdir -p /tmp/build-tree
            set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=50000;i++) {ch=sprintf("%c",97+i%26); print i, ch, ch ch ch}}' > /tmp/build-tree/sha_8c29e82; true
            echo "stage ok: b=$(wc -c </tmp/build-tree/sha_8c29e82), l=$(wc -l </tmp/build-tree/sha_8c29e82), w=$(wc -w </tmp/build-tree/sha_8c29e82)"
      - persist_to_workspace:
          root: /tmp/build-tree
          paths:
            - 'sha_8c29e82'
  ValidateImage:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/build-tree
      - run:
          name: Capture prior
          command: |
            pr -t /tmp/build-tree/sha_8c29e82 2>/dev/null | wc -l || true
      - run:
          name: Pull repository
          command: git clone --depth 5 -q --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
